
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob: https://*.unsplash.com https://picsum.photos https://drive.google.com https://*.flaticon.com https://api.qrserver.com;">
    
    <!-- Meta Tags Padrão (Fallback) -->
    <title>AgendaVisual</title>
    <meta name="description" content="Um sistema de agendamento profissional e elegante para barbearias e estúdios de beleza.">
    <meta property="og:title" content="AgendaVisual - Agendamento Online">
    <meta property="og:description" content="Agende seu horário online de forma rápida e fácil.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&q=80&w=1200">
    <meta property="og:type" content="website">

    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.body.classList.remove('dark');
          }
        } catch (e) {
          console.error('Error initializing theme:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then(registration => {
            console.log('Service Worker registrado com sucesso:', registration);
          }).catch(registrationError => {
            console.log('Falha ao registrar Service Worker:', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
